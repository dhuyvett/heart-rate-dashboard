name: Create and Publish Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional semantic version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string
      play_track:
        description: "Google Play track to deploy"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - internal
          - alpha
          - production
      play_release_status:
        description: "Google Play release status"
        required: true
        default: "completed"
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted

permissions:
  contents: write
  id-token: write

concurrency:
  group: create-release-from-main
  cancel-in-progress: false

jobs:
  create-release:
    name: Test, Build, Upload, and Publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PLAY_TRACK: ${{ inputs.play_track }}
      PLAY_RELEASE_STATUS: ${{ inputs.play_release_status }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld libsqlite3-dev

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage --branch-coverage

      - name: Resolve release tag
        id: release_meta
        uses: ./.github/actions/resolve-release-tag
        with:
          release_version: ${{ inputs.release_version }}
          build_number: ${{ github.run_number }}

      - name: Generate release notes
        id: release_notes
        uses: ./.github/actions/generate-release-notes

      - name: Create Android signing files
        uses: ./.github/actions/create-android-signing-files
        with:
          keystore_base64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          store_password: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          key_password: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Create or update draft release
        run: |
          set -euo pipefail
          if [ "$RELEASE_EXISTS" = "true" ]; then
            gh release edit "$TAG" \
              --repo "$REPO" \
              --target "$COMMIT_SHA" \
              --title "$TAG" \
              --notes-file "${{ steps.release_notes.outputs.notes_file }}" \
              --draft=true
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --target "$COMMIT_SHA" \
              --title "$TAG" \
              --notes-file "${{ steps.release_notes.outputs.notes_file }}" \
              --draft
          fi

      - name: Upload release assets
        run: |
          gh release upload "$TAG" \
            --repo "$REPO" \
            --clobber \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAY_SA_EMAIL }}

      - name: Upload App Bundle to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: org.dhuyvetter.heart_rate_dashboard
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_RELEASE_STATUS }}
          releaseName: ${{ steps.release_meta.outputs.tag }}
          whatsNewDirectory: ${{ steps.release_notes.outputs.whatsnew_dir }}

      - name: Publish release
        run: |
          gh release edit "$TAG" \
            --repo "$REPO" \
            --draft=false
